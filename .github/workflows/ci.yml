name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: >-
          ruff check src tests scripts
          crews/business-coaching-crew/tools
          crews/technical-due-diligence/tools
          crews/research-evidence-synthesis/tools
          crews/incident-analysis/tools
      - name: Format check
        run: >-
          ruff format --check src tests scripts
          crews/business-coaching-crew/tools
          crews/technical-due-diligence/tools
          crews/research-evidence-synthesis/tools
          crews/incident-analysis/tools
      - name: Strict type check
        run: mypy src/crewdefine
      - name: Tests, crew validation, and coverage
        run: pytest

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test on Python ${{ matrix.python-version }}
        run: pytest --no-cov

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
